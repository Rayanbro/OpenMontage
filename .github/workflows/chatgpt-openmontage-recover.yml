name: Recover previously rendered 20-minute MP4

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful chapter render run ID'
        required: true
        default: '43283877250'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-openmontage-recover.yml'

permissions:
  contents: read
  actions: read

jobs:
  recover-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download existing 20 chapters
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id || '43283877250' }}
          github-token: ${{ github.token }}
          pattern: longform-shard-*
          path: segments
          merge-multiple: true
      - name: Assemble and validate MP4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('segments').glob('chapter-*.mp4'))
          assert len(files)==20, f'Expected 20 chapters, found {len(files)}'
          with open('concat.txt','w') as f:
              for file in files:
                  f.write(f"file '{file.resolve()}'\n")
          PY
          ffmpeg -hide_banner -nostdin -loglevel error -f concat -safe 0 -i concat.txt -c copy -movflags +faststart openmontage-20min-explainer.mp4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('openmontage-20min-explainer.mp4')
          assert p.stat().st_size > 0
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(p)]))
          duration=float(info['format']['duration'])
          assert abs(duration-1200)<2, f'Unexpected duration: {duration}'
          print(f'Final MP4: {duration:.2f} seconds, {p.stat().st_size:,} bytes')
          PY
      - name: Upload complete 20-minute video
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-recovered-20-minute-mp4
          path: openmontage-20min-explainer.mp4
          if-no-files-found: error
          retention-days: 7
